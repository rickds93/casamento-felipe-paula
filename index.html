<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Felipe & Paula</title>
  <style>
    :root {
      --bg: #f8fbff;
      --paper: #fffefd;
      --text: #2d3b4f;
      --accent: #355b88;
      --accent-soft: #6f8fb5;
      --line: #c8d8ea;
      --button-bg: #496f9e;
      --button-text: #ffffff;
      --petal-1: rgba(109, 148, 194, 0.24);
      --petal-2: rgba(140, 172, 214, 0.2);
      --leaf-1: rgba(123, 145, 153, 0.2);
      --leaf-2: rgba(174, 189, 196, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: "Georgia", "Times New Roman", serif;
      background-color: var(--bg);
      padding:
        max(18px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
    }

    /* ENTRADA GERAL (FADE + ZOOM) */
    body.ready .convite {
      animation: fadeZoomIn 1.2s cubic-bezier(.22,.61,.36,1) both;
    }

    @keyframes fadeZoomIn {
      0% {
        opacity: 0;
        transform: scale(0.965) translateY(12px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -8vmax;
      pointer-events: none;
      z-index: -3;
    }

    /* FUNDO FLORAL */
    body::before {
      background:
        radial-gradient(22vmax 22vmax at 9% 9%, var(--petal-1) 0%, transparent 62%),
        radial-gradient(18vmax 18vmax at 16% 14%, var(--petal-2) 0%, transparent 66%),
        radial-gradient(16vmax 16vmax at 92% 10%, var(--petal-1) 0%, transparent 64%),
        radial-gradient(20vmax 20vmax at 84% 14%, var(--petal-2) 0%, transparent 66%),
        radial-gradient(18vmax 18vmax at 8% 91%, var(--petal-1) 0%, transparent 64%),
        radial-gradient(20vmax 20vmax at 15% 85%, var(--petal-2) 0%, transparent 66%),
        radial-gradient(22vmax 22vmax at 92% 90%, var(--petal-1) 0%, transparent 62%),
        radial-gradient(18vmax 18vmax at 84% 86%, var(--petal-2) 0%, transparent 66%),
        linear-gradient(180deg, #fcfeff 0%, #f7fbff 46%, #f6faff 100%);
      filter: saturate(108%);
    }

    body::after {
      background:
        radial-gradient(12vmax 16vmax at 5% 21%, var(--leaf-1) 0%, transparent 70%),
        radial-gradient(10vmax 14vmax at 23% 7%, var(--leaf-2) 0%, transparent 70%),
        radial-gradient(11vmax 15vmax at 95% 22%, var(--leaf-1) 0%, transparent 70%),
        radial-gradient(10vmax 13vmax at 78% 8%, var(--leaf-2) 0%, transparent 70%),
        radial-gradient(12vmax 16vmax at 5% 79%, var(--leaf-1) 0%, transparent 70%),
        radial-gradient(10vmax 13vmax at 22% 93%, var(--leaf-2) 0%, transparent 70%),
        radial-gradient(11vmax 15vmax at 96% 78%, var(--leaf-1) 0%, transparent 70%),
        radial-gradient(10vmax 14vmax at 79% 92%, var(--leaf-2) 0%, transparent 70%);
      mix-blend-mode: multiply;
      opacity: 0.75;
    }

    /* PARTÍCULAS LEVES */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(130, 165, 206, 0.32);
      filter: blur(0.3px);
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(104vh) translateX(0) scale(0.85);
        opacity: 0;
      }
      10% { opacity: 0.45; }
      85% { opacity: 0.35; }
      100% {
        transform: translateY(-12vh) translateX(22px) scale(1.1);
        opacity: 0;
      }
    }

    /* PÉTALAS CAINDO */
    .petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      top: -12vh;
      width: 16px;
      height: 12px;
      background: radial-gradient(circle at 30% 30%, rgba(191, 214, 240, 0.95), rgba(121, 157, 204, 0.78));
      border-radius: 70% 30% 65% 35% / 55% 45% 55% 45%;
      opacity: 0.65;
      transform-origin: center;
      filter: blur(0.2px);
      animation: fallPetal linear infinite;
    }

    @keyframes fallPetal {
      0% {
        transform: translate3d(0, -15vh, 0) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.7; }
      100% {
        transform: translate3d(34px, 120vh, 0) rotate(340deg);
        opacity: 0;
      }
    }

    .convite {
      text-align: center;
      width: min(100%, 760px);
      background: color-mix(in oklab, var(--paper) 95%, white);
      border: 1px solid color-mix(in oklab, var(--line) 78%, white);
      border-radius: 18px;
      padding: clamp(30px, 6vw, 56px) clamp(18px, 5vw, 44px);
      box-shadow:
        0 16px 40px rgba(61, 95, 141, 0.12),
        0 2px 10px rgba(61, 95, 141, 0.09),
        inset 0 0 0 1px rgba(255, 255, 255, 0.75);
      position: relative;
      backdrop-filter: blur(0.5px);
      opacity: 0;
    }

    .convite::before,
    .convite::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: min(78%, 520px);
      height: 1px;
      background: linear-gradient(90deg, transparent, #9bb7d6 14%, #7e9fc4 50%, #9bb7d6 86%, transparent);
      opacity: 0.75;
    }

    .convite::before { top: 16px; }
    .convite::after { bottom: 16px; }

    h1,
    .data,
    .frase,
    .btn {
      opacity: 0;
      transform: translateY(10px);
    }

    /* TEXTO SURGINDO */
    body.ready h1 { animation: textIn .8s ease forwards .35s; }
    body.ready .data { animation: textIn .8s ease forwards .55s; }
    body.ready .frase { animation: textIn .9s ease forwards .75s; }

    @keyframes textIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: clamp(2rem, 9vw, 3.2rem);
      line-height: 1.06;
      font-weight: 500;
      margin-bottom: clamp(14px, 3.5vw, 22px);
      letter-spacing: 0.2px;
      color: var(--accent);
      text-wrap: balance;
    }

    .data {
      font-size: clamp(1.05rem, 4.4vw, 1.5rem);
      margin-bottom: clamp(20px, 5vw, 30px);
      letter-spacing: 0.45px;
      color: #3e5f89;
    }

    .frase {
      font-style: italic;
      font-size: clamp(1rem, 4.1vw, 1.25rem);
      line-height: 1.55;
      margin-bottom: clamp(26px, 6vw, 38px);
      opacity: 0.95;
      color: #4d6788;
      padding-inline: clamp(4px, 2vw, 24px);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: linear-gradient(180deg, #5a81b1 0%, var(--button-bg) 100%);
      color: var(--button-text);
      min-height: 48px;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: clamp(0.95rem, 3.8vw, 1.02rem);
      letter-spacing: 0.2px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow:
        0 8px 20px rgba(73, 111, 158, 0.33),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }

    /* BOTÃO CRESCENDO */
    body.ready .btn {
      animation: popIn .65s cubic-bezier(.2,.9,.25,1.2) forwards 1s;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.85);
      }
      75% {
        opacity: 1;
        transform: scale(1.05);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .btn:hover {
      transform: translateY(-1px) scale(1.02);
      opacity: 0.96;
      box-shadow:
        0 10px 24px rgba(73, 111, 158, 0.37),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .btn:active { transform: translateY(0) scale(0.99); }

    .btn:focus-visible {
      outline: 2px solid color-mix(in oklab, var(--accent) 76%, black);
      outline-offset: 3px;
    }

    @media (max-width: 560px) {
      body::before,
      body::after { inset: -16vmax; }
      .convite { border-radius: 16px; }
      .btn { width: min(100%, 280px); }
      .petal { width: 14px; height: 10px; }
    }

    @media (max-width: 360px) {
      .convite { padding-inline: 14px; }
      h1 { font-size: clamp(1.7rem, 9.2vw, 2rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
      .convite,
      h1,
      .data,
      .frase,
      .btn { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="particles" aria-hidden="true"></div>
  <div class="petals" aria-hidden="true"></div>

  <main class="convite">
    <h1>Felipe &amp; Paula</h1>
    <p class="data">17 Outubro 2026</p>
    <p class="frase">"O amor nunca falha."</p>
    <a class="btn" href="#presentes">Lista de Presentes</a>
  </main>

  <script>
    const particlesWrap = document.querySelector('.particles');
    const petalsWrap = document.querySelector('.petals');

    function createParticles(count = 20) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('span');
        el.className = 'particle';
        const size = (Math.random() * 4 + 3).toFixed(2);
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.left = `${Math.random() * 100}%`;
        el.style.animationDuration = `${16 + Math.random() * 20}s`;
        el.style.animationDelay = `${-Math.random() * 20}s`;
        el.style.opacity = `${0.2 + Math.random() * 0.35}`;
        particlesWrap.appendChild(el);
      }
    }

    function createPetals(count = 14) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('span');
        el.className = 'petal';
        el.style.left = `${Math.random() * 100}%`;
        el.style.animationDuration = `${18 + Math.random() * 18}s`;
        el.style.animationDelay = `${-Math.random() * 26}s`;
        el.style.transform = `rotate(${Math.random() * 360}deg)`;
        petalsWrap.appendChild(el);
      }
    }

    createParticles(22);
    createPetals(16);

    requestAnimationFrame(() => {
      document.body.classList.add('ready');
    });
  </script>
</body>
</html>
