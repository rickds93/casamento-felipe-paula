<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Felipe & Paula</title>
  <style>
    :root {
      --bg: #f8fbff;
      --paper: #fffefd;
      --text: #2d3b4f;
      --accent: #355b88;
      --accent-soft: #6f8fb5;
      --line: #c8d8ea;
      --button-bg: #496f9e;
      --button-text: #ffffff;
      --petal-1: rgba(109, 148, 194, 0.24);
      --petal-2: rgba(140, 172, 214, 0.2);
      --leaf-1: rgba(123, 145, 153, 0.2);
      --leaf-2: rgba(174, 189, 196, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: "Georgia", "Times New Roman", serif;
      background-color: var(--bg);
      padding:
        max(18px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -8vmax;
      pointer-events: none;
      z-index: -2;
    }

    body::before {
      background:
        radial-gradient(22vmax 22vmax at 9% 9%, var(--petal-1) 0%, transparent 62%),
        radial-gradient(18vmax 18vmax at 16% 14%, var(--petal-2) 0%, transparent 66%),
        radial-gradient(16vmax 16vmax at 92% 10%, var(--petal-1) 0%, transparent 64%),
        radial-gradient(20vmax 20vmax at 84% 14%, var(--petal-2) 0%, transparent 66%),
        radial-gradient(18vmax 18vmax at 8% 91%, var(--petal-1) 0%, transparent 64%),
        radial-gradient(20vmax 20vmax at 15% 85%, var(--petal-2) 0%, transparent 66%),
        radial-gradient(22vmax 22vmax at 92% 90%, var(--petal-1) 0%, transparent 62%),
        radial-gradient(18vmax 18vmax at 84% 86%, var(--petal-2) 0%, transparent 66%),
        linear-gradient(180deg, #fcfeff 0%, #f7fbff 46%, #f6faff 100%);
      filter: saturate(108%);
    }

    body::after {
      background:
        radial-gradient(12vmax 16vmax at 5% 21%, var(--leaf-1) 0%, transparent 70%),
        radial-gradient(10vmax 14vmax at 23% 7%, var(--leaf-2) 0%, transparent 70%),
        radial-gradient(11vmax 15vmax at 95% 22%, var(--leaf-1) 0%, transparent 70%),
        radial-gradient(10vmax 13vmax at 78% 8%, var(--leaf-2) 0%, transparent 70%),
        radial-gradient(12vmax 16vmax at 5% 79%, var(--leaf-1) 0%, transparent 70%),
        radial-gradient(10vmax 13vmax at 22% 93%, var(--leaf-2) 0%, transparent 70%),
        radial-gradient(11vmax 15vmax at 96% 78%, var(--leaf-1) 0%, transparent 70%),
        radial-gradient(10vmax 14vmax at 79% 92%, var(--leaf-2) 0%, transparent 70%);
      mix-blend-mode: multiply;
      opacity: 0.75;
    }

    .convite {
      text-align: center;
      width: min(100%, 760px);
      background: color-mix(in oklab, var(--paper) 95%, white);
      border: 1px solid color-mix(in oklab, var(--line) 78%, white);
      border-radius: 18px;
      padding: clamp(30px, 6vw, 56px) clamp(18px, 5vw, 44px);
      box-shadow:
        0 16px 40px rgba(61, 95, 141, 0.12),
        0 2px 10px rgba(61, 95, 141, 0.09),
        inset 0 0 0 1px rgba(255, 255, 255, 0.75);
      position: relative;
      backdrop-filter: blur(0.5px);
    }

    .convite::before,
    .convite::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: min(78%, 520px);
      height: 1px;
      background: linear-gradient(90deg, transparent, #9bb7d6 14%, #7e9fc4 50%, #9bb7d6 86%, transparent);
      opacity: 0.75;
    }

    .convite::before {
      top: 16px;
    }

    .convite::after {
      bottom: 16px;
    }

    h1 {
      font-size: clamp(2rem, 9vw, 3.2rem);
      line-height: 1.06;
      font-weight: 500;
      margin-bottom: clamp(14px, 3.5vw, 22px);
      letter-spacing: 0.2px;
      color: var(--accent);
      text-wrap: balance;
    }

    .data {
      font-size: clamp(1.05rem, 4.4vw, 1.5rem);
      margin-bottom: clamp(20px, 5vw, 30px);
      letter-spacing: 0.45px;
      color: #3e5f89;
    }

    .frase {
      font-style: italic;
      font-size: clamp(1rem, 4.1vw, 1.25rem);
      line-height: 1.55;
      margin-bottom: clamp(26px, 6vw, 38px);
      opacity: 0.95;
      color: #4d6788;
      padding-inline: clamp(4px, 2vw, 24px);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: linear-gradient(180deg, #5a81b1 0%, var(--button-bg) 100%);
      color: var(--button-text);
      min-height: 48px;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: clamp(0.95rem, 3.8vw, 1.02rem);
      letter-spacing: 0.2px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow:
        0 8px 20px rgba(73, 111, 158, 0.33),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.96;
      box-shadow:
        0 10px 24px rgba(73, 111, 158, 0.37),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:focus-visible {
      outline: 2px solid color-mix(in oklab, var(--accent) 76%, black);
      outline-offset: 3px;
    }

    @media (max-width: 560px) {
      body::before,
      body::after {
        inset: -16vmax;
      }

      .convite {
        border-radius: 16px;
      }

      .btn {
        width: min(100%, 280px);
      }
    }

    @media (max-width: 360px) {
      .convite {
        padding-inline: 14px;
      }

      h1 {
        font-size: clamp(1.7rem, 9.2vw, 2rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="convite">
    <h1>Felipe &amp; Paula</h1>
    <p class="data">17 Outubro 2026</p>
    <p class="frase">"O amor nunca falha."</p>
    <a class="btn" href="#presentes">Lista de Presentes</a>
  </main>
</body>
</html>
