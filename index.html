<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Felipe & Paula</title>
  <style>
    :root {
      --bg: #faf7f2;
      --text: #2d2a26;
      --accent: #8c6a4d;
      --button-bg: #8c6a4d;
      --button-text: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Georgia", "Times New Roman", serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .convite {
      text-align: center;
      max-width: 680px;
      width: 100%;
      border-top: 1px solid #cfc3b6;
      border-bottom: 1px solid #cfc3b6;
      padding: 48px 24px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 500;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .data {
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    .frase {
      font-style: italic;
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      margin-bottom: 36px;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: var(--button-bg);
      color: var(--button-text);
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 1rem;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <main class="convite">
    <h1>Felipe &amp; Paula</h1>
    <p class="data">17 Outubro 2026</p>
    <p class="frase">"O amor nunca falha."</p>
    <a class="btn" href="#presentes">Lista de Presentes</a>
  </main>
</body>
</html>
