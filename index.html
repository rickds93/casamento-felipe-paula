<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Paula & Felipe</title>

  <!-- Fontes: script para nomes + serif elegante para demais textos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- Arquivo CSS externo -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="particles" aria-hidden="true"></div>
  <div class="petals" aria-hidden="true"></div>

  <main class="convite">
    <h1>Paula &amp; Felipe</h1>
    <p class="data">17 Outubro 2026</p>
    <p class="frase">"O amor nunca falha."</p>

    <section class="countdown" aria-label="Contagem regressiva para o casamento">
      <p class="countdown-title">Faltam para o grande dia</p>
      <div class="countdown-grid" id="countdownGrid">
        <div class="countdown-item">
          <span class="countdown-value" id="days">00</span>
          <span class="countdown-label">Dias</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-value" id="hours">00</span>
          <span class="countdown-label">Horas</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-value" id="minutes">00</span>
          <span class="countdown-label">Minutos</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-value" id="seconds">00</span>
          <span class="countdown-label">Segundos</span>
        </div>
      </div>
      <p id="countdownFinished" class="countdown-finished" hidden>Chegou o grande dia! 💙</p>
    </section>

    <div class="buttons-container">
      <a class="btn" href="lista-de-presentes.html">Lista de Presentes</a>
      <button class="btn btn-confirm" id="confirmBtn" type="button">Confirmar Presença</button>
    </div>
  </main>

  <!-- Modal de Confirmação -->
  <div id="confirmModal" class="modal" hidden>
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="closeBtn" type="button" aria-label="Fechar">&times;</button>
      <h2>Confirme sua Presença</h2>
      <form id="confirmForm">
        <div class="form-group">
          <label for="name">Nome *</label>
          <input type="text" id="name" name="name" required placeholder="Seu nome completo">
        </div>
        
        <div class="form-group">
          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email" required placeholder="seu@email.com">
        </div>
        
        <div class="form-group">
          <label for="phone">Telefone *</label>
          <input type="tel" id="phone" name="phone" required placeholder="(00) 00000-0000">
        </div>
        
        <div class="form-group">
          <label for="guests">Número de Acompanhantes *</label>
          <select id="guests" name="guests" required>
            <option value="">Selecione</option>
            <option value="0">Nenhum</option>
            <option value="1">1 pessoa</option>
            <option value="2">2 pessoas</option>
            <option value="3">3 ou mais</option>
          </select>
        </div>

        <div class="form-group checkbox">
          <label for="dietary">
            <input type="checkbox" id="dietary" name="dietary">
            Tenho restrição alimentar
          </label>
        </div>

        <div class="form-group" id="dietaryDetails" hidden>
          <label for="dietaryText">Descreva sua restrição</label>
          <textarea id="dietaryText" name="dietaryText" placeholder="Ex: vegetariano, alergia a glúten..."></textarea>
        </div>

        <button type="submit" class="btn btn-submit">Enviar Confirmação</button>
      </form>
      <p class="modal-success" id="successMessage" hidden>✅ Presença confirmada com sucesso!</p>
    </div>
  </div>

  <!-- Arquivo JavaScript externo -->
  <script src="script.js"></script>
</body>
</html>
